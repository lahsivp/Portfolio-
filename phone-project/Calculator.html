<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
crossorigin="anonymous"
referrerpolicy="no-referrer" />

  <title>Calculator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      color: white;
      border: 0;
      font-family: calibri;
      box-sizing: border-box;
      /* border: .1px solid red; */
    }
    body {
      text-align: center;
      background-color: #00000010;
      overflow: hidden;
    }

    .main {
      width: 100%;
      margin: 0 auto;
      padding: 20px;
      padding-top: 0px;
      background-color: black;
      box-shadow: 4px 4px 20px #00000050;
    }

    .head {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: transparent;
    }

    .head div {
      padding: 0;
      margin: 0;
      width: 24px;
      cursor: pointer;
      background-color: transparent;
    }

    .output {
      height: 220px;
      width: 100%;
      margin-bottom: 20px;
      /* background-color: green; */
      background-color: transparent;
      border-radius: 7px;
      font-size: 2em;
      text-align: right;
      padding: 15px 20px 5px;
      word-wrap: break-word;
      /* overflow: hidden; */
      overflow-x: hidden;
      overflow-y: scroll;
    }

    div div,
    div button {
      width: 60px;
      height: auto;
      margin: 4px 4px;
      padding: 16px 0px;
      background-color: #ffffff28;
      font-size: 22px;
      border-radius: 12px;
      border: none;
      font-weight: 600;
      display: inline-block;
    }

    div button {
      background-color: #ff872e;
    }

    /* History Modal */
    .history-overlay {
      display: none; /* Hidden by default */
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.9); /* Semi-transparent background */
      z-index: 10;
      color: white;
      text-align: left;
      overflow-y: auto;
    }

    .history-overlay .close-btn {
      position: absolute;
      top: 20px;
      right: 30px;
      font-size: 30px;
      cursor: pointer;
      color: #ff872e;
    }
i{
      color: #ff872e;
}
    .history-content {
      width: 100%;
      margin-top: 20px;
      padding: 20px;
      background-color: transparent;
      word-break: break-all;
      font-size: 16px;
    }

    .history-content p {
      font-size: 14px;
      margin: 20px 0;
    }

  </style>
</head>
<body>
  <div class="main">
    <div class="head">
      <div></div>
      <p>Calculator</p>
      <div onclick="showHistory()"><i class="fa-solid fa-clock-rotate-left"></i></div>
    </div>
    <br>
    <div class="output" id="display"></div>
    <br>
    <div onclick="clearDisplay()" style="color: #ff872e;">AC</div>
    <div onclick="appendValue('/')" style="color: #ff872e;">÷</div>
    <div onclick="appendValue('%')" style="color: #ff872e;">%</div>
    <div onclick="appendValue('*')" style="color: #ff872e;">×</div>
    <br>
    <div onclick="appendValue('1')">1</div>
    <div onclick="appendValue('2')">2</div>
    <div onclick="appendValue('3')">3</div>

    <div onclick="appendValue('-')" style="color: #ff872e;">–</div>
    <br>
    <div onclick="appendValue('4')">4</div>
    <div onclick="appendValue('5')">5</div>
    <div onclick="appendValue('6')">6</div>

    <div onclick="appendValue('+')" style="color: #ff872e;">+</div>
    <br>
    <div onclick="appendValue('7')">7</div>
    <div onclick="appendValue('8')">8</div>
    <div onclick="appendValue('9')">9</div>

    <div onclick="deleteLast()" style="color: #ff872e;"><i class="fa-solid fa-delete-left"></i></div>
    <br>
    <div onclick="appendValue('00')">00</div>

    <div onclick="appendValue('0')">0</div>
    <div onclick="appendValue('.')">.</div>

    <button onclick="calculateResult()" style="font-size: 26px;">=</button>
  </div>

  <div class="history-overlay" id="historyOverlay">
    <span class="close-btn" onclick="closeHistory()">×</span>
    <div class="history-content" id="historyContent">
      <h2>Calculation History</h2>
    </div>
  </div>

  <script>
    let history = [];

    function appendValue(value) {
      document.querySelector('#display').innerHTML += value;
    }

    function clearDisplay() {
      document.querySelector('#display').innerHTML = '';
    }

    function deleteLast() {
      let current = document.querySelector('#display').innerHTML;
      document.querySelector('#display').innerHTML = current.slice(0, -1);
    }

    function calculateResult() {
      let expression = document.querySelector('#display').innerHTML;
      try {
        let result = eval(expression);
        document.querySelector('#display').innerHTML = result;
        saveToHistory(expression + ' = ' + result);
      } catch (error) {
        document.querySelector('#display').innerHTML = 'Error';
      }
    }

    function saveToHistory(entry) {
      history.push(entry);  // Save the calculation in history array
    }

    function showHistory() {
      let historyOverlay = document.getElementById('historyOverlay');
      let historyContent = document.getElementById('historyContent');

      // Clear previous content
      historyContent.innerHTML = '<h2>Calculation History</h2>';

      if (history.length > 0) {
        history.forEach((item, index) => {
          let historyItem = document.createElement('p');
          historyItem.textContent = `${index + 1}. ${item}`;
          historyContent.appendChild(historyItem);
        });
      } else {
        let noHistory = document.createElement('p');
        noHistory.textContent = 'No history available';
        historyContent.appendChild(noHistory);
      }

      // Show the overlay
      historyOverlay.style.display = 'block';
    }

    function closeHistory() {
      document.getElementById('historyOverlay').style.display = 'none';
    }

  </script>
</body>
</html>
