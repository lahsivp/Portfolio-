  <script>
    let currentIndex = 0;

    function showSlide(index) {
        const slides = document.querySelectorAll('.slide');
        const dots = document.querySelectorAll('.dot');

        // Prevent exceeding bounds
        if (index >= slides.length) return;
        if (index < 0) return;

        slides.forEach((slide, i) => {
            //slide.classList.remove('active');
            dots[i].classList.remove('active');
            if (i === index) {
                //slide.classList.add('active');
            }
        });

        document.querySelector('.slides').style.transform = `translateX(-${index * 100}%)`;
        dots[index].classList.add('active');
    }

    function currentSlide(index) {
        if (index < 0 || index >= document.querySelectorAll('.slide').length) return;
        currentIndex = index;
        showSlide(currentIndex);
    }

    let touchstartX = 0;
    let touchendX = 0;

    const slider = document.querySelector('.slider');

    slider.addEventListener('touchstart', (event) => {
        touchstartX = event.changedTouches[0].screenX;
    });

    slider.addEventListener('touchend', (event) => {
        touchendX = event.changedTouches[0].screenX;
        handleGesture();
    });

    function handleGesture() {
        if (touchendX < touchstartX) {
            if (currentIndex < document.querySelectorAll('.slide').length - 1) {
                currentIndex++;
            }
        }
        if (touchendX > touchstartX) {
            if (currentIndex > 0) {
                currentIndex--;
            }
        }
        showSlide(currentIndex);
    }
  </script>
  
  
  <script>
      function updateTime() {
    const now = new Date();

    const hours = now.getHours().toString().padStart(2, '0');
    const minutes = now.getMinutes().toString().padStart(2, '0');
  //  const seconds = now.getSeconds().toString().padStart(2, '0');

    const days = ['Sun', 'Mon', 'Tues', 'Wed', 'Thursday', 'Fri', 'Sat'];
    const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

    const day = days[now.getDay()];
    const date = now.getDate();
    const month = months[now.getMonth()];
    const year = now.getFullYear();

    const timeString = `${hours}:${minutes}`;
    const dateString = `${day}, ${date} ${month}, ${year}`;

    document.getElementById('time_main').textContent = timeString;
    document.getElementById('dd-mm-yy').textContent = dateString;
}

setInterval(updateTime, 1000);
updateTime();

    </script>
