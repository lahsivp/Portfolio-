<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lock Screen</title>
  <style>
  
@import url('https://fonts.googleapis.com/css2?family=Itim&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Rajdhani:wght@300;400;500;600;700&display=swap');

    * {
      margin: -0px;
      padding: -0px;
      /* border: .1px solid red; */
      color: white;
      font-family: calibri;
      box-sizing: border-box;
      text-decoration: none;
    }
    
    body {
      width: 100%;
      /* max-height: 4000px; */
      /* height: 720px; */
      background: url(lock-wall.jpg);
      background-repeat: no-repeat;
      background-size: cover;
border-radius: 22px;
    }
    
    #video-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: black;
      z-index: 1000;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9;
    }
    
    #video-container video {
      width: 320px;
    }
    
    #main-content {
      width: 100%;
      min-height: 638px;;
      position: relative;
    }
    
    .lock-time {
      margin-top: 80px;
      padding-left: 12px;
    }
    
    #dd {
      font-size: 16px;
      color: lightgrey;
      font-weight: bold;
    }
    
    #time_main {
      font-size: 78px;
      font-weight: bold;
 font-family: "Rajdhani", sans-serif;
  font-weight: 400;
  font-style: normal;
    }
    
    #mm-yy {
      font-size: 14px;
      font-weight: bold;
      color: darkgrey;
    }
    
    .lock-bottom {
      position: absolute;
      bottom: 0px;
     width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px;
    }
    a {
      font-size: 12px;
    }

  </style>
</head>

<body>
  <div id="video-container">
        <video id="loaderVideo" autoplay muted>
            <source src="boot.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>
  
  <div id="main-content">
    <div class="lock-time">
      <div id="dd"></div>
      <div id="time_main"></div>
      <div id="mm-yy"></div>
      
    </div>
    <div class="lock-bottom">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" height="18px">
        <path fill="currentColor"
                                                                                                                                d="M256 512A256 256 0 1 0 256 0a256 256 0 1 0 0 512zm0-352a96 96 0 1 1 0 192 96 96 0 1 1 0-192z" />
      </svg>
      <a href="lock-screen.html">Click to Unlock</a>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" height="18px">
        <path fill="currentColor"
                                                                                                                                d="M149.1 64.8L138.7 96 64 96C28.7 96 0 124.7 0 160L0 416c0 35.3 28.7 64 64 64l384 0c35.3 0 64-28.7 64-64l0-256c0-35.3-28.7-64-64-64l-74.7 0L362.9 64.8C356.4 45.2 338.1 32 317.4 32L194.6 32c-20.7 0-39 13.2-45.5 32.8zM256 192a96 96 0 1 1 0 192 96 96 0 1 1 0-192z" />
      </svg>
    </div>
  </div>
  
  <script>
    window.onload = function() {
        const loader = document.getElementById('video-container');
        const content = document.getElementById('main-content');
        const loaderVideo = document.getElementById('loaderVideo');

        // Check if the video has been played
        if (!localStorage.getItem('videoPlayed')) {
            loaderVideo.onended = function() {
                // Hide loader and show content after video ends
                loader.style.display = 'none';
                content.style.display = 'block';
                // Set flag in local storage
                localStorage.setItem('videoPlayed', 'true');
            };
        } else {
            // If the video has been played, hide loader and show content directly
            loader.style.display = 'none';
            content.style.display = 'block';
        }
    };
</script>
  
  <script>
    function updateTime() {
    const now = new Date();

    const hours = now.getHours().toString().padStart(2, '0');
    const minutes = now.getMinutes().toString().padStart(2, '0');
  //  const seconds = now.getSeconds().toString().padStart(2, '0');

    const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

    const day = days[now.getDay()];
    const date = now.getDate();
    const month = months[now.getMonth()];
    const year = now.getFullYear();

    const timeString = `${hours}:${minutes}`;
    const dayString = `${day}`;
    const dateString = `${date} ${month}, ${year}`;

    document.getElementById('time_main').textContent = timeString;
    document.getElementById('mm-yy').textContent = dateString;
    document.getElementById('dd').textContent = dayString;
}

setInterval(updateTime, 1000);
updateTime();

  </script>
</body>

</html>
