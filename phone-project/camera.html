<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enable Camera</title>
  <style>
    *{
    margin: -0px;
    padding: -0px;
    box-sizing: border-box;
  }
  body{
    background-color: black;
    
      font-family: Arial, sans-serif;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      /* align-items: center; */

  }
  img{
    width: 100%;
  }
    video {
      width: 100%;
      height: 100%;
    }
    
    
        #messageBox {
      display: none;
      position: absolute;
      bottom: 70px;
      background-color: white;
      color: black;
      padding: 6px 10px;
      font-size: 12px;
      width: 250px;
      text-align: center;
      border-radius: 4px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      transform: translateY(100%);
      animation: slideIn 0.5s ease forwards;
    }

    @keyframes slideIn {
      0% {
        transform: translateY(100%);
      }
      100% {
        transform: translateY(-20px);
      }
    }

    @keyframes slideOut {
      0% {
        transform: translateY(-20px);
      }
      100% {
        transform: translateY(100%);
      }
    }
    
  </style>
</head>
<body>
  <img src="camera-top.jpg" alt=""><br>
  <video id="videoElement" autoplay></video><br>
  <img src="camera-bottom.jpg" id="showMessageBtn" alt="">
  
  <div id="messageBox" class="message"></div>
  
  <script>
    // Function to start the camera
    function startCamera() {
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({ video: true })
          .then(function(stream) {
            // Get the video element
            var videoElement = document.getElementById('videoElement');
            // Set the source of the video element to the camera stream
            videoElement.srcObject = stream;
          })
          .catch(function(error) {
            alert('Camera access denied or not available.');
            console.error("Error accessing the camera: ", error);
          });
      } else {
        alert("Your browser does not support camera access.");
      }
    }

    // Call the function to start the camera when the page loads
    window.onload = startCamera;
  </script>
  
   <script>
    document.getElementById("showMessageBtn").addEventListener("click", function() {
      const messageBox = document.getElementById("messageBox");

      // Set the message content dynamically
      const message = "Capture feature is currently unavailable! Please try again later.";
      
      messageBox.textContent = message;

      // Show the message with animation
      messageBox.style.display = "block";
      messageBox.style.animation = "slideIn 0.5s ease forwards";

      // Automatically hide the message after 3 seconds with a closing animation
      setTimeout(function() {
        messageBox.style.animation = "slideOut 0.5s ease forwards";

        // Hide the message completely after animation is done
        setTimeout(function() {
          messageBox.style.display = "none";
        }, 500);
      }, 3000); // 3 seconds before closing
    });
  </script>
  
  
    <script>
  document.addEventListener('contextmenu', event => event.preventDefault());
  document.addEventListener('keydown', event => {
    if (event.key === 'F12' || (event.ctrlKey && event.key === 'u')) {
      event.preventDefault();
    }
  });
</script>
  
</body>
</html>
