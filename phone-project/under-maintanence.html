<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centered Content</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            height: 100%;
        }
        body {
            display: flex;
            justify-content: center; 
            align-items: center;   
            font-family: Arial, sans-serif;
            background-color: white;
        }
        .container {
            text-align: center;
            padding: 20px;
            margin-top: -80px;
        }
        img {
            max-width: 100%;
            height: auto; 
        }
        p{
          font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="u-m.png" alt="">
        <h3>Oops! This App is Under Maintenance</h3>
        <p>Sorry, the app won’t work right now because we're performing maintenance to improve your experience. We’ll be back soon.
        <br> Thank you for your understanding.</p>
    </div>
</body>
</html>
